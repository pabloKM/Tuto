<script type="module">
import * as THREE from 'three';
import { OutlineEffect } from 'three/addons/effects/OutlineEffect.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const COL = {
  bg: 0x8FD0EE, head: 0xFDBA1C, face: 0xE4F400, torso: 0xF3C23C, pants: 0x2A2630,
  red: 0xE8502E, lav: 0xB0A2C4, lavDark: 0x7E6C9C, sticker: 0x5A4A78, ink: 0x161216
};
const SKY = 0x9AD6F2;

let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
catch (e) { document.getElementById('err').style.display = 'flex'; throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 260, 1500);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 2600);
const effect = new OutlineEffect(renderer, { defaultThickness: 0.0065, defaultColor: [0.07, 0.05, 0.07] });

scene.add(new THREE.AmbientLight(0xffffff, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 2.3);
scene.add(sun, sun.target);

const ramp = new THREE.DataTexture(new Uint8Array([120, 195, 255]), 3, 1, THREE.RedFormat);
ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;
const matCache = {};
function toon(color, outline = true) {
  const k = color + (outline ? 'o' : 'n');
  if (!matCache[k]) {
    matCache[k] = new THREE.MeshToonMaterial({ color, gradientMap: ramp });
    if (!outline) matCache[k].userData.outlineParameters = { visible: false };
  }
  return matCache[k];
}
const mesh = (g, c, outline = true) => new THREE.Mesh(g, toon(c, outline));

// ---------- character ----------
// elbows and knees follow from the swing the pose already chose: arms bend as they swing forward, legs bend as they swing back or lift
function limbBends(P, runAmt) {
  for (const [hip, kn, sh, el] of [[P.hipL, P.knL, P.shL, P.elL], [P.hipR, P.knR, P.shR, P.elR]]) {
    const hx = hip.rotation.x;
    kn.rotation.x = Math.min(1.9, Math.max(0, hx) * 1.1 + Math.max(0, -hx - 0.4) * 0.55 + 0.04);
    const over = Math.min(1, Math.max(0, (Math.abs(sh.rotation.z) - 1.6) / 1.0));
    el.rotation.x = -(0.14 + Math.max(0, -sh.rotation.x) * 0.9 * (0.4 + 0.6 * runAmt)) * (1 - over);
  }
}
function buildCharacter() {
  const root = new THREE.Group();     // origin at feet, +Y up, +Z forward
  // flip pivot sits at the middle of the character (stick-cap top is at ~3.2) so flips
  // and upside-down stick-spins rotate around the right point
  const FLIP_C = 1.6;
  const flip = new THREE.Group(); flip.position.y = FLIP_C; flip.rotation.order = 'YXZ'; root.add(flip);
  const offs = new THREE.Group(); offs.position.y = -FLIP_C; flip.add(offs);
  const body = new THREE.Group(); offs.add(body);
  const parts = { flip, FLIP_C };

  // legs + boots (legs 50% longer than v1)
  const LIFT = 0.25; // everything above the hips moves up by the extra leg length
  const bootGeo = new RoundedBoxGeometry(0.3, 0.22, 0.4, 4, 0.09);
  for (const s of [-1, 1]) {
    const hip = new THREE.Group(); hip.position.set(0.16 * s, 0.62 + LIFT, 0); body.add(hip);
    // two-segment leg: thigh, knee joint, shin + boot (total length unchanged)
    const thigh = mesh(new THREE.CylinderGeometry(0.1, 0.099, 0.35, 14), COL.pants); thigh.position.y = -0.175; hip.add(thigh);
    const kn = new THREE.Group(); kn.position.y = -0.35; hip.add(kn);
    kn.add(mesh(new THREE.SphereGeometry(0.103, 14, 10), COL.pants));
    const shin = mesh(new THREE.CylinderGeometry(0.099, 0.1, 0.34, 14), COL.pants); shin.position.y = -0.17; kn.add(shin);
    const boot = mesh(bootGeo, COL.red); boot.position.set(0.01 * s, -0.4, 0.05); kn.add(boot);
    // boot shaft: covers the ankle
    const shaftB = mesh(new THREE.CylinderGeometry(0.122, 0.135, 0.2, 18), COL.red); shaftB.position.set(0.005 * s, -0.25, 0.0); kn.add(shaftB);
    parts[s < 0 ? 'knL' : 'knR'] = kn;
    parts[s < 0 ? 'hipL' : 'hipR'] = hip;
  }
  // pants (big round hips)
  const pants = mesh(new THREE.SphereGeometry(1, 28, 18), COL.pants);
  pants.scale.set(0.37, 0.29, 0.3); pants.position.y = 0.74 + LIFT; body.add(pants);
  // torso
  const torso = mesh(new THREE.CylinderGeometry(0.17, 0.3, 0.32, 24), COL.torso);
  torso.position.y = 0.99 + LIFT; body.add(torso);
  // match the torso's depth/width ratio to the pants (0.30/0.37) so the waistline sits level all the way round
  const TORSO_Z = 0.3 / 0.37; torso.scale.z = TORSO_Z; parts.torsoZ = TORSO_Z;
  const neck = mesh(new THREE.CylinderGeometry(0.11, 0.13, 0.16, 16), COL.torso);
  neck.position.y = 1.18 + LIFT; body.add(neck);
  // arms + mittens (arms 50% longer than v1)
  for (const s of [-1, 1]) {
    const sh = new THREE.Group(); sh.position.set(0.24 * s, 1.08 + LIFT, 0); sh.rotation.z = 0.38 * s; body.add(sh);
    // two-segment arm: upper arm, elbow joint, forearm + glove (reach unchanged)
    const upper = mesh(new THREE.CapsuleGeometry(0.07, 0.15, 4, 10), COL.torso); upper.position.y = -0.135; sh.add(upper);
    const el = new THREE.Group(); el.position.y = -0.27; sh.add(el);
    el.add(mesh(new THREE.SphereGeometry(0.074, 12, 10), COL.torso));
    const fore = mesh(new THREE.CapsuleGeometry(0.066, 0.14, 4, 10), COL.torso); fore.position.y = -0.13; el.add(fore);
    const mitt = mesh(new THREE.SphereGeometry(0.13, 18, 14), COL.red); mitt.scale.set(1, 1.08, 0.9); mitt.position.y = -0.27; el.add(mitt);
    const thumb = mesh(new THREE.SphereGeometry(0.055, 12, 10), COL.red); thumb.position.set(-0.09 * s, -0.22, 0.07); el.add(thumb);
    // glove cuff: covers the wrist
    const cuff = mesh(new THREE.CylinderGeometry(0.088, 0.105, 0.15, 16), COL.red); cuff.position.y = -0.15; el.add(cuff);
    parts[s < 0 ? 'elL' : 'elR'] = el;
    parts[s < 0 ? 'shL' : 'shR'] = sh;
  }

  // head
  const head = new THREE.Group(); head.position.y = 1.8 + LIFT; body.add(head); parts.head = head;
  const HR = 0.62;
  head.add(mesh(new THREE.SphereGeometry(HR, 40, 28), COL.head));
  // face: black rim + yellow-green disc (spherical caps facing +Z)
  const rim = mesh(new THREE.SphereGeometry(HR + 0.006, 40, 16, 0, Math.PI * 2, 0, 0.98).rotateX(Math.PI / 2), COL.ink, false);
  const face = mesh(new THREE.SphereGeometry(HR + 0.012, 40, 16, 0, Math.PI * 2, 0, 0.9).rotateX(Math.PI / 2), COL.face, false);
  head.add(rim, face);
  const Z = new THREE.Vector3(0, 0, 1);
  const onFace = (m, x, y, z, off) => {
    const d = new THREE.Vector3(x, y, z).normalize();
    m.position.copy(d).multiplyScalar(HR + off);
    m.quaternion.setFromUnitVectors(Z, d); head.add(m); return m;
  };
  parts.eyes = [];
  for (const s of [-1, 1]) {
    const eye = mesh(new THREE.SphereGeometry(1, 12, 10), COL.ink, false);
    eye.scale.set(0.034, 0.048, 0.02); onFace(eye, 0.11 * s, 0.25, 1, 0.012);
    parts.eyes.push(eye);
  }
  const nose = mesh(new THREE.SphereGeometry(1, 18, 14), COL.red);
  nose.scale.set(0.085, 0.12, 0.09); onFace(nose, 0, 0.0, 1, 0.04);
  const mouth = mesh(new THREE.TorusGeometry(0.115, 0.014, 6, 20, Math.PI).rotateZ(Math.PI), COL.ink, false);
  onFace(mouth, 0, -0.27, 1, 0.022);

  // collar + analog stick
  const collar = mesh(new THREE.CylinderGeometry(0.2, 0.25, 0.16, 24), COL.head);
  collar.position.y = HR - 0.04; head.add(collar);
  const collarLine = mesh(new THREE.TorusGeometry(0.205, 0.012, 6, 28), COL.ink, false);
  collarLine.rotation.x = Math.PI / 2; collarLine.position.y = HR + 0.04; head.add(collarLine);
  const stick = new THREE.Group(); stick.position.y = HR + 0.05; head.add(stick); parts.stick = stick;
  const spinG = new THREE.Group(); stick.add(spinG); parts.spin = spinG;
  const shaft = mesh(new THREE.CylinderGeometry(0.085, 0.09, 0.3, 16), COL.lav); shaft.position.y = 0.15; spinG.add(shaft);
  const under = mesh(new THREE.CylinderGeometry(0.44, 0.42, 0.05, 36), COL.lavDark); under.position.y = 0.3; spinG.add(under);
  const dome = mesh(new THREE.SphereGeometry(0.44, 36, 12, 0, Math.PI * 2, 0, Math.PI / 2), COL.lav);
  dome.scale.y = 0.36; dome.position.y = 0.32; spinG.add(dome);
  const topY = 0.32 + 0.44 * 0.36;
  const stk = mesh(new THREE.SphereGeometry(1, 20, 10), COL.sticker, false);
  stk.scale.set(0.12, 0.035, 0.12); stk.position.y = topY - 0.01; spinG.add(stk);
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2 + 0.4;
    const nub = mesh(new THREE.SphereGeometry(1, 10, 8), COL.sticker, false);
    nub.scale.set(0.035, 0.025, 0.035); nub.position.set(Math.cos(a) * 0.17, topY - 0.025, Math.sin(a) * 0.17); spinG.add(nub);
  }
  parts.torso = torso; parts.headY = head.position.y; parts.shY = 1.08 + LIFT;
  return { root, body, parts };
}

const hero = buildCharacter();
const CHAR_SCALE = 0.5;
hero.root.scale.setScalar(CHAR_SCALE);

    }

  // trains in the yard (roofs reachable with a double-jump)

  for (let k = 0; k < 60; k++) { const x = 175 + rnd() * 200, n = 440 + rnd() * 480; if (Math.abs(x - 300) + Math.abs(n - 690) > 25) addTree(w, x, n, 1 + rnd() * 0.5); }
  for (const [, n, wd] of EW) for (let x = -745; x < 140; x += 18) {

  // ---- Manhattan, across the river (generic skyline) ----
  const far = new Buf();
  for (let n = -900; n < 2600; n += 38 + rnd() * 30) {
    for (let x = 1520; x < 2100; x += 45 + rnd() * 40) {
      const dense = (n < -350 ? 2.4 : n > 1500 ? 2.1 : 1) * (1 - (x - 1520) / 900);

    { name: 'Gus', role: 'Fisherman', x: 455, n: 228, shirt: 0xE8502E, skin: 0xF0C29E, hat: 'beanie', hatC: 0x2E7D5B, lines: [

    { name: 'Coach', role: 'Baseball Fan', x: 240, n: 990, shirt: 0xFFFFFF, skin: 0xB07850, hat: 'cap', hatC: 0xE8502E, lines: [

    { name: 'Dee', role: 'Dog Walker', x: -222, n: 468, shirt: 0x9DB89A, skin: 0x6E4630, hat: 'none', lines: [

  ];
  w.zones = [

function lpGeo(geo) { geo.deleteAttribute('normal'); geo.deleteAttribute('uv'); const g = mergeVertices(geo); g.computeVertexNormals(); return g; }
const ownToon = (c, flat = false) => { const m = new THREE.MeshToonMaterial({ color: c, gradientMap: ramp, flatShading: flat }); m.userData.own = true; return m; };
const miniCv = document.getElementById('mini'), miniCtx = miniCv.getContext('2d');
let miniBase = null;

function textSprite(text, sub) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 80; const x = c.getContext('2d');
  x.font = '34px "Patrick Hand", sans-serif'; const tw = Math.min(240, x.measureText(text).width + 26);
  x.fillStyle = 'rgba(255,248,230,.95)'; x.strokeStyle = '#1a1418'; x.lineWidth = 5;
  x.beginPath(); x.roundRect(128 - tw / 2, 6, tw, 46, 12); x.fill(); x.stroke();
  x.fillStyle = '#1a1418'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text, 128, 30);
  if (sub) { x.font = '20px "Patrick Hand", sans-serif'; x.fillStyle = '#fff'; x.strokeStyle = '#1a1418'; x.lineWidth = 4; x.strokeText(sub, 128, 66); x.fillText(sub, 128, 66); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(noOutline(new THREE.SpriteMaterial({ map: t, depthWrite: false })));
  sp.scale.set(2.6, 0.81, 1); return sp;
}
const bangTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');

  x.fillStyle = '#E8502E'; x.font = 'bold 36px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('!', 32, 32);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();

function buildNPC(o) {

    const hand = mesh(new THREE.SphereGeometry(0.09, 10, 8), o.skin); hand.position.set(0.41 * s, 0.62, 0); body.add(hand); }

  return { g, body, head, tag, bang, spec: o, yaw: 0, ph: rnd() * 6 };
}

function finishWorld(w, PPM, segM) {
  const b = w.b, Wm = b.x1 - b.x0, Hm = b.n1 - b.n0;
  PPM = Math.min(PPM, 4096 / Wm, 4096 / Hm);
  const cv = document.createElement('canvas'); cv.width = Math.round(Wm * PPM); cv.height = Math.round(Hm * PPM);
  const x = cv.getContext('2d');
  const P = { k: PPM, X: v => (v - b.x0) * PPM, Y: n => (b.n1 - n) * PPM,
    rect(x0, n0, x1, n1) { x.beginPath(); x.rect(P.X(Math.min(x0, x1)), P.Y(Math.max(n0, n1)), Math.abs(x1 - x0) * PPM, Math.abs(n1 - n0) * PPM); },
    poly(pts, close = true) { x.beginPath(); pts.forEach(([a, n], i) => i ? x.lineTo(P.X(a), P.Y(n)) : x.moveTo(P.X(a), P.Y(n))); if (close) x.closePath(); } };
  w.ops.sort((p, q) => p[0] - q[0]);
  for (const [, fn] of w.ops) { x.save(); fn(x, P); x.restore(); }
  w.ops = [];

  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const segX = Math.max(1, Math.round(Wm / segM)), segZ = Math.max(1, Math.round(Hm / segM));
  const gg = new THREE.PlaneGeometry(Wm * S, Hm * S, segX, segZ); gg.rotateX(-Math.PI / 2);
  gg.translate((b.x0 + Wm / 2) * S, 0, -(b.n0 + Hm / 2) * S);
  const pa = gg.attributes.position;
  for (let i = 0; i < pa.count; i++) pa.setY(i, w.tU(pa.getX(i), pa.getZ(i)));
  gg.computeVertexNormals();
  const gmat = noOutline(new THREE.MeshToonMaterial({ map: tex, gradientMap: ramp })); gmat.userData.own = true;
  w.root.add(new THREE.Mesh(gg, gmat));
  const water = noOutline(new THREE.Mesh(new THREE.PlaneGeometry(9000, 9000), new THREE.MeshToonMaterial({ color: 0x4FA9D6, gradientMap: ramp })));
  water.material.userData.own = true; water.rotation.x = -Math.PI / 2; water.position.set((b.x0 + Wm / 2) * S, WATER_Y, -(b.n0 + Hm / 2) * S);
  w.root.add(water); w.water = water;

  for (const buf of w.chunks.values()) {
    if (!buf.p.length) continue;
    w.root.add(bufMesh(buf, bldgMat));
    if (buf.l.length) { const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(buf.l, 3)); w.root.add(new THREE.LineSegments(lg, edgeMat)); }
  }
  w.chunks.clear();

  // trees (merged, outlined, faceted)
  if (w.trees.length) {
    const can = lpGeo(new THREE.IcosahedronGeometry(1, 0)), trk = lpGeo(new THREE.CylinderGeometry(0.15, 0.22, 1, 6).translate(0, 0.5, 0));
    const sets = [[], []], trunks = [], m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), v = new THREE.Vector3(), sc = new THREE.Vector3();
    for (const t of w.trees) {

const SPEED = 5, ZAP_SPEED = 9.5, GRAV = 22, JUMP_V = 7.6, FLIP_V = JUMP_V * 1.3, FLIP_DUR = 0.62, RAD = 0.32;
let sparkAcc = 0, simT = 0;
let blinkAt = 1500, blinkStart = -1000;
let usedFlip = false, flipT = -1;
let idleTime = 0, dancing = false;
const BD_START = 7;
let sitting = true, sitAmt = 1;
let gliding = false, glideAmt = 0, spinV = 0;
const lastSafe = { x: 0, z: 0, h: 0, t: 0 };
// wall-running & tree trampolines
let wallRun = false, wallAmt = 0; const wall = { c: null, nx: 0, nz: 1 };
const kick = new THREE.Vector3();             // horizontal push (wall-jumps, hopping onto roofs)
const TREE_V = 14;
const qG = new THREE.Quaternion(), qW = new THREE.Quaternion(), WY = new THREE.Vector3(0, 1, 0);
camPitch = 0.6; camDist = 8.5;

const tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3(), tmpQ = new THREE.Quaternion(), basis = new THREE.Matrix4();
const stickTarget = new THREE.Quaternion();
const ortho = v => { v.y = 0; return v.normalize(); };
const signedAngle = (a, b) => Math.atan2(up.dot(tmpV2.copy(a).cross(b)), a.dot(b));
const ease = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const wrapPi = a => Math.atan2(Math.sin(a), Math.cos(a));
const lerp = (a, b, k) => a + (b - a) * k;

function placePlayer() {
  const s = world.spawn, [x, z] = M(s.x, s.n);
  pl.set(x, 0, z);
  height = floorAt(x, z, world.tU(x, z) + 0.2); vy = 0; grounded = true; floorH = height;
  facing.set(Math.sin(s.dir), 0, -Math.cos(s.dir)); camFwd.copy(facing);
  sitting = !!s.sit; sitAmt = sitting ? 1 : 0;
  Object.assign(lastSafe, { x, z, h: height });
}
const inBounds = (x, z) => { const b = world.b; return x > (b.x0 + 3) * S && x < (b.x1 - 3) * S && -z > (b.n0 + 3) * S && -z < (b.n1 - 3) * S; };
function canStand(x, z) {
  if (!inBounds(x, z)) return false;
  if (world.tU(x, z) > height + (grounded ? STEP : 0.05)) return false;
  return !solidAt(x, z, height, RAD);
}
function tryMove(dx, dz) {
  const x = pl.x, z = pl.z;
  if (canStand(x + dx, z + dz)) { pl.x += dx; pl.z += dz; return true; }
  if (Math.abs(dx) > 1e-5 && canStand(x + dx, z)) { pl.x += dx; return false; }
  if (Math.abs(dz) > 1e-5 && canStand(x, z + dz)) { pl.z += dz; return false; }
  return false;
}

const dlgEl = document.getElementById('dlg'), dlgWho = dlgEl.querySelector('.who'), dlgTxt = dlgEl.querySelector('.txt'), dlgMore = dlgEl.querySelector('.more');

// ---------- title → swoop → play ----------
let mode = 'title', swoopT = 0, controls = false, titleT = 0, lastZone = '', zoneT = 0;
const A_POS = new THREE.Vector3(), A_LOOK = new THREE.Vector3();
const titleEl = document.getElementById('title');
function startGame() {

addEventListener('pointerdown', () => startGame(), true);

// ---------- per-frame ----------
function update(dt) {
  simT += dt * 1000;
  let kx = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0);
  let ky = (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0);
  let ix = touchVec.x, iy = touchVec.y;
  if (kx || ky) { const l = Math.hypot(kx, ky); ix = kx / l; iy = ky / l; }
  if (dlg.open) {
    if (input.jump) advanceDialog();
    const line = dlg.npc.spec.lines[dlg.i];
    if (line) { dlg.shown = Math.min(line.length, dlg.shown + dt * 48); dlgTxt.textContent = line.slice(0, Math.floor(dlg.shown)); dlgMore.style.visibility = dlg.shown >= line.length ? 'visible' : 'hidden'; }
  }
  if (!controls || dlg.open) { ix = iy = 0; input.jump = false; }
  let mag = Math.min(1, Math.hypot(ix, iy));
  knob.setAttribute('transform', `translate(${100 + ix * KNOB_MAX} ${132 - iy * KNOB_MAX})`);

  if (sitting && (mag > 0.1 || input.jump)) { sitting = false; input.jump = false; }
  sitAmt += ((sitting ? 1 : 0) - sitAmt) * Math.min(1, 6 * dt);
  mag *= (1 - sitAmt);

  if (mode === 'play') {
    const turn = orbitDelta * 0.006 + ((keys.has('KeyE') ? 1 : 0) - (keys.has('KeyQ') ? 1 : 0)) * 2.2 * dt;
    camPitch = THREE.MathUtils.clamp(camPitch + pitchDelta * 0.005, PITCH_MIN, PITCH_MAX);
    if (turn) camFwd.applyAxisAngle(up, -turn);
  }
  orbitDelta = 0; pitchDelta = 0;
  const camHeld = camPtrs.size > 0;

  const move = new THREE.Vector3();
  const right = tmpV.copy(camFwd).cross(up).normalize();
  move.addScaledVector(right, ix).addScaledVector(camFwd, iy);
  if (move.lengthSq() > 1e-6) move.normalize();

  const zapping = controls && (zapOn || keys.has('ShiftLeft') || keys.has('ShiftRight'));
  const zapRun = zapping && mag > 0.08;
  if (mag > 0.08) {
    const dist = (zapping ? ZAP_SPEED : SPEED) * (gliding ? 1.15 : 1) * mag * dt;
    // sub-step so fast runs don't tunnel through thin walls
    const n = Math.ceil(dist / 0.25);
    let blocked = false;
    if (!wallRun) for (let i = 0; i < n; i++) if (!tryMove(move.x * dist / n, move.z * dist / n)) blocked = true;
    if (blocked && !wallRun && !sitting && mag > 0.3) { const hit = findWall(move); if (hit) startWallRun(hit); }
    const a = signedAngle(facing, move);
    facing.applyAxisAngle(up, a * Math.min(1, 14 * dt));
    const ca = signedAngle(camFwd, facing);
    if (mode === 'play' && !camHeld && Math.abs(ca) < 2.2) camFwd.applyAxisAngle(up, ca * Math.min(1, 0.9 * mag * dt));
  }
  ortho(camFwd); ortho(facing);

  // ---- running up walls ----
  if (wallRun) {
    const c = wall.c, into = -(move.x * wall.nx + move.z * wall.nz);
    camFwd.lerp(tmpV.set(-wall.nx, 0, -wall.nz), Math.min(1, 3 * dt)); ortho(camFwd);
    facing.set(-wall.nx, 0, -wall.nz);
    if (input.jump) {                                   // wall-jump: kick off backwards, flip still available
      wallRun = false; vy = JUMP_V * 1.15; kick.set(wall.nx, 0, wall.nz).multiplyScalar(7);
      facing.set(wall.nx, 0, wall.nz); camFwd.copy(facing); usedFlip = false; input.jump = false;
    } else if (mag < 0.2 || into < 0.25) {              // let go: drop off the wall
      wallRun = false; vy = 1.5; kick.set(wall.nx, 0, wall.nz).multiplyScalar(3);
    } else {
      height += (zapping ? ZAP_SPEED : SPEED) * 1.1 * mag * dt; vy = 0; airT = 0;
      if (height >= c.top - 0.12) {                     // made it: hop over the edge onto the roof
        wallRun = false; height = c.top + 0.05; vy = 6.5; kick.set(-wall.nx, 0, -wall.nz).multiplyScalar(4.5);
        usedFlip = false;
      }
    }
  }
  // leftover push from wall-jumps / mantles
  if (kick.lengthSq() > 0.0004) {
    const k = kick.clone().multiplyScalar(dt), n = Math.ceil(k.length() / 0.25);
    for (let i = 0; i < n; i++) tryMove(k.x / n, k.z / n);
    kick.multiplyScalar(Math.max(0, 1 - 2.2 * dt));
  } else kick.set(0, 0, 0);

  // ---- what's under his feet: ground, rooftops, benches, train roofs, the Hudson ----
  const floor = floorAt(pl.x, pl.z, height);
  floorH = floor;

  if (wallRun) input.jump = false;
  if (input.jump) {
    if (grounded) { vy = JUMP_V; grounded = false; usedFlip = false; }
    else if (!usedFlip) { vy = FLIP_V; usedFlip = true; flipT = 0; }
  }
  input.jump = false;

  if (grounded && !wallRun) {
    if (height - floor > 0.6) { grounded = false; vy = 0; }    // walked off an edge
    else height = floor;
  }
  // ---- trees are trampolines ----
  const tc = cellAt(pl.x, pl.z);
  if (tc && !wallRun) for (const c of tc) {
    if (c.kind !== 'tree') continue;
    c.cool -= dt; if (c.cool > 0) continue;
    const dh = Math.hypot(pl.x - c.cx, pl.z - c.cz);
    if (grounded) {                                      // run into the trunk → boing up into the leaves
      if (dh < c.tr + RAD + 0.2 && mag > 0.1) { vy = JUMP_V * 1.2; grounded = false; usedFlip = false; }
    } else {
      const dy = (height + 0.5 - c.cy) / c.ry, q = (dh / c.r) ** 2 + dy * dy;
      if (q < 1.2 && vy < 4) { treeBounce(c); break; }
    }
  }
  gliding = !grounded && !wallRun && controls && jumpHeld && vy < 0 && flipT < 0;
  if (!grounded && !wallRun) {
    if (gliding) vy = Math.max(vy - GRAV * 0.12 * dt, -1.5);
    else vy -= GRAV * dt;
    height += vy * dt; airT += dt;
    if (height <= floor && vy <= 0) { height = floor; vy = 0; grounded = true; airT = 0; usedFlip = false; flipT = -1; }
  }
  glideAmt += ((gliding ? 1 : 0) - glideAmt) * Math.min(1, 10 * dt);

  // splash! — into the Hudson (or any water), then back on dry land
  if (height < WATER_Y + 0.3) {
    pl.set(lastSafe.x, 0, lastSafe.z); height = lastSafe.h; vy = 0; grounded = true;
    hint(world.name === 'Hoboken' ? 'SPLASH! The Hudson says no. Back to dry land.' : 'SPLASH! Back to dry land.', 2600);
  } else if (grounded && floor > WATER_Y + 1 && simT - lastSafe.t > 400 && world.tU(pl.x, pl.z) > -0.5) {
    Object.assign(lastSafe, { x: pl.x, z: pl.z, h: height, t: simT });
  }

  if (mode === 'play' && grounded && !wallRun && !sitting && mag < 0.05 && !dlg.open) idleTime += dt; else idleTime = 0;
  dancing = idleTime > BD_START;

  // place character
  const pos = new THREE.Vector3(pl.x, height, pl.z);
  hero.root.position.copy(pos);
  const xAxis = new THREE.Vector3().copy(up).cross(facing).normalize();
  basis.makeBasis(xAxis, up, facing);
  qG.setFromRotationMatrix(basis);
  wallAmt += ((wallRun ? 1 : 0) - wallAmt) * Math.min(1, 12 * dt);
  if (wallAmt > 0.001) {               // tip over so his feet are on the wall
    const n = tmpV.set(wall.nx, 0, wall.nz);
    basis.makeBasis(tmpV2.copy(n).cross(WY).normalize(), n, WY); qW.setFromRotationMatrix(basis);
    qG.slerp(qW, wallAmt);
    hero.root.position.addScaledVector(n, -0.28 * wallAmt);
  }
  hero.root.quaternion.copy(qG);

  shadow.position.set(pl.x, floor + 0.04, pl.z);
  const ss = 1 / (1 + (height - floor) * 0.5); shadow.scale.setScalar(ss); shadow.material.opacity = 0.22 * ss;

  const gnd = grounded || wallRun;
  // ---------- animation ----------
  const P = hero.parts, F = P.flip;
  runAmt += ((gnd ? mag : 0) - runAmt) * Math.min(1, 10 * dt);
  runPhase += dt * (6 + 9 * mag) * (gnd ? 1 : 0) * (zapRun ? 1.6 : 1);
  const sw = Math.sin(runPhase);
  const zr = zapRun ? 1 : 0;
  const t = simT / 1000;
  const id = gnd ? (1 - runAmt) * (1 - sitAmt) : 0;
  const sp = t * Math.PI * 2 / 1.4;
  const sway = Math.sin(sp), bounce = Math.abs(Math.cos(sp));
  const br = Math.sin(t * Math.PI * 2 / 3.2) * (0.6 + 0.4 * (gnd ? 1 - runAmt : 0));
  P.torso.scale.set(1 + 0.07 * br, 1 + 0.05 * br, (1 + 0.08 * br) * P.torsoZ);
  P.head.position.y = P.headY + 0.028 * br;
  P.shL.position.y = P.shR.position.y = P.shY + 0.022 * br;
  P.hipL.rotation.z = P.hipR.rotation.z = 0;
  let flipX = null, flipY = null;

  if (dancing) {
    const ph = (idleTime - BD_START) % 7.8;
    hero.body.position.y = 0; hero.body.rotation.set(0, 0, 0);
    if (ph < 2.4) {
      const w = ph * Math.PI * 2 / 0.8, s1 = Math.sin(w);
      P.hipL.rotation.x = -0.7 * Math.max(0, s1); P.hipR.rotation.x = -0.7 * Math.max(0, -s1);
      P.hipL.rotation.z = 0.25 * Math.max(0, s1); P.hipR.rotation.z = -0.25 * Math.max(0, -s1);
      P.shL.rotation.x = -1.3 + 0.6 * s1; P.shR.rotation.x = -1.3 - 0.6 * s1;
      P.shL.rotation.z = -0.6; P.shR.rotation.z = 0.6;
      hero.body.position.y = 0.06 * Math.abs(Math.cos(w));
      flipX = 0; flipY = 0.45 * s1;
    } else if (ph < 2.8) {
      const k = ease((ph - 2.4) / 0.4);
      flipX = Math.PI * k; flipY = 0;
      P.hipL.rotation.z = -0.6 * k; P.hipR.rotation.z = 0.6 * k;
      P.shL.rotation.z = -0.38 - 1.0 * k; P.shR.rotation.z = 0.38 + 1.0 * k; P.shL.rotation.x = P.shR.rotation.x = 0;
      P.hipL.rotation.x = P.hipR.rotation.x = 0;
    } else if (ph < 6.0) {
      const spin = (ph - 2.8) * (14 * Math.PI / 3.2);
      flipX = Math.PI; flipY = spin;
      P.hipL.rotation.z = -0.75 - 0.25 * Math.sin(spin * 0.5); P.hipR.rotation.z = 0.75 + 0.25 * Math.sin(spin * 0.5);
      P.hipL.rotation.x = 0.45 * Math.sin(spin * 0.5); P.hipR.rotation.x = -0.45 * Math.sin(spin * 0.5);
      P.shL.rotation.z = -1.5; P.shR.rotation.z = 1.5; P.shL.rotation.x = P.shR.rotation.x = 0;
    } else if (ph < 7.4) {
      flipX = Math.PI - 0.3; flipY = 0;
      P.hipL.rotation.x = -1.3; P.hipR.rotation.z = 0.95; P.hipR.rotation.x = 0.2;
      P.shL.rotation.z = -2.2; P.shR.rotation.z = 0.9; P.shL.rotation.x = 0; P.shR.rotation.x = 0.6;
    } else {
      const k = ease((ph - 7.4) / 0.4);
      flipX = Math.PI - 0.3 + (Math.PI + 0.3) * k; flipY = 0;
      P.hipL.rotation.x = -1.3 * (1 - k); P.hipR.rotation.z = 0.95 * (1 - k);
      P.shL.rotation.z = -0.38 - 1.8 * (1 - k); P.shR.rotation.z = 0.38 + 0.5 * (1 - k);
      P.shL.rotation.x = 0; P.shR.rotation.x = 0;
    }
  } else if (gnd) {
    const legAmp = (0.85 + 0.25 * zr) * runAmt;
    P.hipL.rotation.x = sw * legAmp - 0.35 * id * Math.max(0, -sway);
    P.hipR.rotation.x = -sw * legAmp - 0.35 * id * Math.max(0, sway);
    if (zr) { P.shL.rotation.x = 1.0 + sw * 0.25; P.shR.rotation.x = 1.0 - sw * 0.25; }
    else {
      P.shL.rotation.x = -sw * 0.9 * runAmt + 0.4 * id * Math.sin(sp + 1);
      P.shR.rotation.x = sw * 0.9 * runAmt - 0.4 * id * Math.sin(sp + 1);
    }
    const flap = 0.1 * runAmt + 0.18 * id * bounce;
    P.shL.rotation.z = -0.38 - flap; P.shR.rotation.z = 0.38 + flap;
    hero.body.position.y = Math.abs(sw) * 0.09 * runAmt + 0.04 * id * bounce;
    hero.body.rotation.x = (0.12 + 0.2 * zr) * runAmt;
    hero.body.rotation.z = 0.09 * id * sway;
    // sitting with his back against the collar, legs out in front
    if (sitAmt > 0.001) {
      const s = sitAmt;
      P.hipL.rotation.x = lerp(P.hipL.rotation.x, -1.5, s); P.hipR.rotation.x = lerp(P.hipR.rotation.x, -1.42, s);
      P.hipL.rotation.z = lerp(0, -0.12, s); P.hipR.rotation.z = lerp(0, 0.12, s);
      P.shL.rotation.x = lerp(P.shL.rotation.x, 0.45, s); P.shR.rotation.x = lerp(P.shR.rotation.x, 0.45, s);
      P.shL.rotation.z = lerp(P.shL.rotation.z, -0.62, s); P.shR.rotation.z = lerp(P.shR.rotation.z, 0.62, s);
      hero.body.position.y = lerp(hero.body.position.y, -0.66, s);
      hero.body.rotation.x = lerp(hero.body.rotation.x, -0.3, s);
      hero.body.rotation.z = lerp(hero.body.rotation.z, 0, s);
    }
  } else if (flipT >= 0) {
    flipT += dt;
    const k = Math.min(1, flipT / FLIP_DUR), tuck = Math.sin(k * Math.PI);
    flipX = Math.PI * 2 * ease(k); flipY = 0;
    P.hipL.rotation.x = P.hipR.rotation.x = -1.5 * tuck;
    P.shL.rotation.x = P.shR.rotation.x = -1.2 * tuck;
    P.shL.rotation.z = -0.38 - 0.3 * tuck; P.shR.rotation.z = 0.38 + 0.3 * tuck;
    hero.body.position.y = 0; hero.body.rotation.set(0, 0, 0);
    if (k >= 1) { flipT = -1; flipX = 0; }
  } else {
    const k = Math.min(1, airT * 8), g = glideAmt;
    // jump pose, blending into a glide pose (arms out like wings, legs trailing)
    P.hipL.rotation.x = lerp(-0.9 * k, 0.35, g); P.hipR.rotation.x = lerp(0.35 * k, 0.5, g);
    P.shL.rotation.x = lerp(-0.4 * k, 0, g); P.shR.rotation.x = lerp(-0.4 * k, 0, g);
    P.shL.rotation.z = lerp(-0.38 - 1.6 * k, -1.5, g); P.shR.rotation.z = lerp(0.38 + 1.6 * k, 1.5, g);
    hero.body.position.y = 0; hero.body.rotation.x = lerp(0.05, 0.35, g); hero.body.rotation.z = Math.sin(t * 3) * 0.08 * g;
  }
  limbBends(P, runAmt);
  if (flipX !== null) { F.rotation.x = flipX; F.rotation.y = flipY; }
  else {
    const kk = Math.min(1, 14 * dt);
    F.rotation.x = wrapPi(F.rotation.x) * (1 - kk); F.rotation.y = wrapPi(F.rotation.y) * (1 - kk);
  }
  P.head.rotation.z = dancing ? 0 : Math.sin(runPhase * 0.5) * 0.05 * runAmt - 0.1 * id * Math.sin(sp - 0.5);
  P.head.rotation.x = dancing ? 0 : -0.05 * id * bounce - 0.12 * sitAmt;

  // hero blinking
  if (simT > blinkAt) { blinkStart = simT; blinkAt = simT + (Math.random() < 0.2 ? 240 : 1800 + Math.random() * 3600); }
  const bk = simT - blinkStart < 130 ? Math.sin(Math.PI * (simT - blinkStart) / 130) : 0;
  P.eyes.forEach(e => e.scale.set(0.034 * (1 + 0.3 * bk), 0.048 * (1 - 0.88 * bk), 0.02));

  // sticks mirror the input; his stick cap spins like a propeller while gliding
  if (mag > 0.02) {
    const inv = tmpQ.copy(hero.root.quaternion).invert();
    const local = move.clone().applyQuaternion(inv);
    const flipInv = new THREE.Quaternion().setFromEuler(F.rotation).invert();
    const headInv = new THREE.Quaternion().setFromEuler(P.head.rotation).invert();
    local.applyQuaternion(flipInv).applyQuaternion(headInv);
    stickTarget.setFromAxisAngle(new THREE.Vector3(local.z, 0, -local.x).normalize(), 0.5 * mag);
    const gx = move.x, gz = move.z, gl = Math.hypot(gx, gz);
  } else { stickTarget.identity(); }
  P.stick.quaternion.slerp(stickTarget, Math.min(1, 18 * dt));
  spinV += ((gliding ? 28 : 0) - spinV) * Math.min(1, 3 * dt);
  P.spin.rotation.y += spinV * dt;


  // electric spark trail
  if (zapRun) {
    sparkAcc += dt * (grounded ? 70 : 40);
    const back = facing.clone().negate();
    while (sparkAcc >= 1) {
      sparkAcc -= 1;
      const foot = (Math.random() < 0.5 ? P.knL : P.knR);
      const fp = new THREE.Vector3(0, -0.4, 0); foot.localToWorld(fp);
      fp.addScaledVector(back, Math.random() * 0.35).addScaledVector(up, 0.05);
      emitSpark(fp, up, Math.random() < 0.25);
      if (Math.random() < 0.12) {
        const bp = pos.clone().addScaledVector(up, 0.5 + Math.random() * 0.9)
          .add(new THREE.Vector3(Math.random() - .5, Math.random() - .5, Math.random() - .5).multiplyScalar(0.8));
        emitSpark(bp, up, false);
      }
    }
  } else sparkAcc = 0;
  updateSparks(dt);

  // ---- people: look at you when you're close; "!" when you can talk ----
  nearNPC = null; let nd = 3.2;
  for (const n of world.npcs) {
    const dx = pl.x - n.x, dz = pl.z - n.z, d = Math.hypot(dx, dz);
    if (d < nd && Math.abs(height - n.g.position.y) < 2) { nd = d; nearNPC = n; }
    if (d < 9) n.yaw += wrapPi(Math.atan2(dx, dz) - n.yaw) * Math.min(1, 5 * dt);
    n.g.rotation.y = n.yaw;
    n.body.position.y = Math.abs(Math.sin(simT / 600 + n.ph)) * 0.03;
    n.head.rotation.z = Math.sin(simT / 900 + n.ph) * 0.06;
    n.tag.visible = d < 40;
  }
  for (const n of world.npcs) n.bang.visible = n === nearNPC && !dlg.open;
  talkBtn.classList.toggle('show', !!nearNPC && !dlg.open && controls);

  // ---- place names ----
  zoneT += dt;
  if (mode === 'play' && zoneT > 0.25) {
    zoneT = 0;
    const xm = pl.x / S, nm = -pl.z / S;
    const z = world.zones.find(q => xm >= q[2] && xm <= q[4] && nm >= q[3] && nm <= q[5]);
    const name = z ? z[0] : '';
    if (name && name !== lastZone) showPlace(z[0].toUpperCase(), z[1]);
    lastZone = name;
  }

  // ---------- camera ----------
  const camTarget = new THREE.Vector3().copy(pos).addScaledVector(up, 0.9).addScaledVector(camFwd, 0.8);
  const desired = new THREE.Vector3().copy(pos).addScaledVector(up, 0.8 + Math.sin(camPitch) * camDist)
    .addScaledVector(camFwd, -Math.cos(camPitch) * camDist);
  desired.y = Math.max(desired.y, world.tU(desired.x, desired.z) + 0.8);
  if (mode === 'title') {
    titleT += dt;
    const a = titleT * 0.06 + 2.2, R0 = 150;
    tmpV.set(pl.x + Math.sin(a) * R0, height + 85, pl.z + Math.cos(a) * R0);
    camera.position.copy(tmpV); camera.up.set(0, 1, 0); camera.lookAt(pl.x, height, pl.z);
  } else if (mode === 'swoop') {
    swoopT += dt;
    const k = ease(Math.min(1, swoopT / 2.6));
    camera.position.lerpVectors(A_POS, desired, k); camera.up.set(0, 1, 0);
    camera.lookAt(tmpV.lerpVectors(A_LOOK, camTarget, k));
    if (k > 0.7 && !controls) { controls = true; document.body.classList.remove('intro'); }
    if (k >= 1) {
      mode = 'play';
      showPlace(world.title.split(',')[0].toUpperCase(), world.title.includes(',') ? world.title.split(',')[1].trim() : '');
      lastZone = 'start';
      hint('Move: stick / WASD · Jump: ⬆ / Space (twice = flip, hold = glide) · ⚡ / Shift: run · Run into a wall to run up it · Trees are bouncy · 🗺 loads a real OpenStreetMap file', 9000);
    }
  } else {
    const k = Math.min(1, 7 * dt);
    camera.position.lerp(desired, k);
    camera.up.set(0, 1, 0);
    camera.lookAt(camTarget);
  }

  // key light follows the hero
  const rightNow = new THREE.Vector3().copy(camFwd).cross(up);
  sun.position.copy(pos).addScaledVector(up, 9).addScaledVector(rightNow, 4).addScaledVector(camFwd, -5); sun.target.position.copy(pos);

  // minimap
  if (miniBase && mode !== 'title') {
    miniCtx.drawImage(miniBase, 0, 0);
    const k = world.miniK, mx = (pl.x / S - world.b.x0) * k, my = (world.b.n1 + pl.z / S) * k;
    const a = Math.atan2(facing.x, -facing.z);
    miniCtx.save(); miniCtx.translate(mx, my); miniCtx.rotate(a);
    miniCtx.fillStyle = '#E8502E'; miniCtx.strokeStyle = '#1a1418'; miniCtx.lineWidth = 2;
    miniCtx.beginPath(); miniCtx.moveTo(0, -7); miniCtx.lineTo(5, 5); miniCtx.lineTo(0, 2.5); miniCtx.lineTo(-5, 5); miniCtx.closePath(); miniCtx.fill(); miniCtx.stroke();
    miniCtx.restore();
    miniCtx.fillStyle = '#FDBA1C'; miniCtx.strokeStyle = '#1a1418'; miniCtx.lineWidth = 1.5;
    for (const n of world.npcs) { miniCtx.beginPath(); miniCtx.arc((n.x / S - world.b.x0) * k, (world.b.n1 + n.z / S) * k, 2.6, 0, 7); miniCtx.fill(); miniCtx.stroke(); }
  }
}

// ---------- wall & tree helpers ----------
function closestOnPoly(x, z, poly) {
  let best = Infinity, bx = x, bz = z;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [ax, az] = poly[j], [cx, cz] = poly[i], dx = cx - ax, dz = cz - az, l2 = dx * dx + dz * dz;
    const t = l2 ? clamp(((x - ax) * dx + (z - az) * dz) / l2, 0, 1) : 0, px = ax + t * dx, pz = az + t * dz, d = Math.hypot(x - px, z - pz);
    if (d < best) { best = d; bx = px; bz = pz; }
  }
  return [bx, bz, best];
}
function findWall(dir) {
  const px = pl.x + dir.x * (RAD + 0.2), pz = pl.z + dir.z * (RAD + 0.2), a = cellAt(px, pz);
  if (!a) return null;
  for (const c of a) {
    if (c.kind !== 'solid' || c.noClimb || c.top - height < 0.8 || c.base > height + 1.6) continue;
    if (!(pointInPoly(px, pz, c.poly) || distToPoly(px, pz, c.poly) < RAD)) continue;
    const [cx, cz, d] = closestOnPoly(pl.x, pl.z, c.poly);
    let nx = pl.x - cx, nz = pl.z - cz;
    if (d < 1e-4) { nx = -dir.x; nz = -dir.z; } else { nx /= d; nz /= d; }
    if (-(dir.x * nx + dir.z * nz) < 0.45) continue;     // only when heading into it, not sliding along it
    return { c, nx, nz };
  }
  return null;
}
function startWallRun(h) {
  wallRun = true; wall.c = h.c; wall.nx = h.nx; wall.nz = h.nz;
  grounded = false; vy = 0; flipT = -1; kick.set(0, 0, 0);
}
const leafTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  x.translate(32, 32); x.rotate(0.6); x.beginPath(); x.ellipse(0, 0, 26, 13, 0, 0, 7);
  x.fillStyle = '#fff'; x.fill(); x.lineWidth = 6; x.strokeStyle = '#141018'; x.stroke();
  x.beginPath(); x.moveTo(-22, 0); x.lineTo(22, 0); x.lineWidth = 4; x.stroke();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
function treeBounce(c) {
  vy = TREE_V; grounded = false; usedFlip = false; flipT = -1; c.cool = 0.25;
  for (let i = 0; i < 14; i++) {
    const m = new THREE.SpriteMaterial({ map: leafTex, color: [0x6DBE5A, 0x9be07a, 0xc8f07a, 0x4f9a46][i % 4], transparent: true, depthWrite: false });
    const s = new THREE.Sprite(m); s.position.set(pl.x + (Math.random() - .5) * 1.4, height + 0.3, pl.z + (Math.random() - .5) * 1.4);
    const size = 0.3 + Math.random() * 0.25; s.scale.setScalar(size); scene.add(s);
    const vel = new THREE.Vector3((Math.random() - .5) * 5, 1 + Math.random() * 3, (Math.random() - .5) * 5);
    sparks.push({ s, vel, life: 0, max: 0.6 + Math.random() * 0.5, size, spin: (Math.random() - .5) * 10 });
  }
}

// ---------- boot ----------
(async () => {
  try { await Promise.race([document.fonts.load('40px "Patrick Hand"'), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
  buildHoboken();
  placePlayer();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt);
    effect.render(scene, camera);
    requestAnimationFrame(frame);
  }
  update(0);
  requestAnimationFrame(frame);
})();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
window.__debug = { input, touchVec, keys, hero, pl, get world() { return world; }, get mode() { return mode; }, floorAt, solidAt };
</script>
