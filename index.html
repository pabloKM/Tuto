<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#E8502E; touch-action:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; font-family:'Patrick Hand', 'Comic Sans MS', cursive; }
  canvas { display:block; }
  #stickZone { position:fixed; left:0; bottom:0; width:200px; height:215px; z-index:2; border-top-right-radius:60px; }
  #joy { position:fixed; left:18px; bottom:18px; width:150px; height:165px; pointer-events:none; z-index:3; }
  #jump { position:fixed; right:22px; bottom:26px; width:92px; height:92px; z-index:4; border-radius:50%;
    border:5px solid rgba(20,16,24,.55); background:rgba(255,255,255,.08); color:rgba(20,16,24,.65);
    font:inherit; font-size:24px; display:flex; align-items:center; justify-content:center; padding:0; }
  #jump.on { background:rgba(255,255,255,.28); }
  #zap { position:fixed; right:128px; bottom:34px; width:76px; height:76px; z-index:4; border-radius:50%;
    border:5px solid rgba(20,16,24,.55); background:rgba(255,255,255,.08); padding:0;
    display:flex; align-items:center; justify-content:center; transition:background .15s, transform .15s; }
  #zap.on { background:#7ff3ff; border-color:#141018; transform:scale(1.06); box-shadow:0 0 0 4px rgba(255,240,90,.8); }
  #hint { pointer-events:none; position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:5; color:#1a1418;
    background:rgba(255,240,220,.85); border:3px solid #1a1418; border-radius:14px; padding:6px 14px;
    font-size:18px; text-align:center; transition:opacity .8s; max-width:88vw; }
  #music { position:fixed; top:14px; right:14px; z-index:4; width:46px; height:46px; border-radius:50%;
    border:4px solid rgba(20,16,24,.55); background:rgba(255,255,255,.12); color:rgba(20,16,24,.75);
    font:inherit; font-size:24px; line-height:1; padding:0; }
  #music.off { opacity:.45; text-decoration:line-through; }
  #joy, #jump, #zap, #hint, #music, #mp, #act, #roomChip { transition: opacity .6s; }
  body.intro #music, body.intro #mp, body.intro #act, body.intro #roomChip { opacity:0; pointer-events:none; }
  #mp { position:fixed; top:14px; right:68px; z-index:4; width:46px; height:46px; border-radius:50%;
    border:4px solid rgba(20,16,24,.55); background:rgba(255,255,255,.12); padding:0; display:flex; align-items:center; justify-content:center; }
  #act { position:fixed; right:40px; bottom:140px; width:70px; height:70px; z-index:4; border-radius:50%;
    border:5px solid rgba(20,16,24,.55); background:rgba(255,255,255,.08); padding:0; display:flex; align-items:center; justify-content:center; opacity:.55; }
  #act .i-throw { display:none; }
  #act.ready { opacity:1; background:#FFE94A; border-color:#141018; animation: actpulse 1s ease-in-out infinite; }
  #act.throw .i-grab { display:none; } #act.throw .i-throw { display:block; }
  @keyframes actpulse { 50% { transform: scale(1.08); } }
  #roomChip { position:fixed; top:18px; left:14px; z-index:4; font:inherit; font-size:17px;
    padding:4px 14px; border:3px solid #161216; border-radius:14px; color:#161216; white-space:nowrap; }
  #mpPanel { position:fixed; inset:0; z-index:20; background:rgba(22,18,22,.45); display:flex; align-items:center; justify-content:center; }
  #mpPanel[hidden] { display:none; }
  .mp-card { width:min(320px, 86vw); background:#FFF4E6; border:4px solid #161216; border-radius:22px; box-shadow:8px 8px 0 #161216; padding:18px 20px; color:#161216; text-align:center; }
  .mp-card h3 { margin:0 0 8px; font-size:28px; }
  .mp-card p { margin:4px 0 12px; font-size:17px; line-height:1.25; }
  .mp-card button { font:inherit; }
  .mp-big { width:100%; font-size:22px !important; padding:8px; border:3px solid #161216; border-radius:14px; background:#FDBA1C; box-shadow:3px 3px 0 #161216; margin:4px 0; }
  .mp-ghost { background:none; border:none; font-size:17px !important; text-decoration:underline; margin-top:6px; color:#161216; }
  .mp-or { margin:12px 0 6px; font-size:16px; opacity:.7; }
  .mp-row { display:flex; gap:8px; }
  .mp-row input { flex:1; min-width:0; font:inherit; font-size:24px; text-transform:uppercase; letter-spacing:6px; text-align:center; border:3px solid #161216; border-radius:12px; padding:4px; background:#fff; }
  .mp-row button { font-size:20px !important; border:3px solid #161216; border-radius:12px; background:#7ED6A8; padding:0 14px; box-shadow:3px 3px 0 #161216; }
  .mp-code { font-size:46px; letter-spacing:10px; font-weight:bold; margin:-4px 0 6px; }
  #mpStatus { min-height:20px; font-size:15px; margin-top:8px; color:#B3261E; }
  #mpPanel[data-state="out"] .mp-in, #mpPanel[data-state="busy"] .mp-in, #mpPanel[data-state="in"] .mp-out, #mpPanel[data-state="busy"] .mp-out { display:none; }
  body.intro #joy, body.intro #jump, body.intro #zap, body.intro #stickZone, body.intro #hint { opacity:0 !important; pointer-events:none; }
  #hint { opacity:0; }
  #tap { position:fixed; left:50%; bottom:9%; transform:translateX(-50%); z-index:6; pointer-events:none;
    font-size:28px; color:#1a1418; background:rgba(255,240,220,.9); border:4px solid #1a1418; border-radius:18px;
    padding:6px 22px; transition:opacity .4s; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { transform:translateX(-50%) scale(1.08); } }
  #err { position:fixed; inset:0; display:none; align-items:center; justify-content:center; color:#fff; font-size:22px; padding:20px; text-align:center; }
  /* ---------- mode menu / modes ---------- */
  #holdRing { position:fixed; z-index:6; pointer-events:none; border:6px solid #FFD23C; border-radius:50%; opacity:0; transform:translate(-50%,-50%) scale(.3); box-shadow:0 0 0 3px #161216; }
  #holdRing.go { animation: ringgo .55s linear forwards; }
  @keyframes ringgo { 0% { opacity:.15; transform:translate(-50%,-50%) scale(.3); } 100% { opacity:1; transform:translate(-50%,-50%) scale(1); } }
  #flash { position:fixed; inset:0; z-index:50; pointer-events:none; opacity:0; transition:opacity .38s ease-in; }
  #frameBox { position:fixed; inset:0; z-index:30; background:#161216; display:none; }
  #frameBox iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#161216; }
  body.m-frame #frameBox { display:block; }
  #eject { position:fixed; z-index:35; display:none; align-items:center; justify-content:center; gap:4px; font:inherit; color:#161216;
    background:#FFD23C; border:3px solid #161216; box-shadow:2px 3px 0 #161216; padding:0; }
  #eject b { font-size:22px; font-weight:normal; line-height:1; } #eject span { font-size:17px; }
  body.m-frame #eject { display:flex; left:0; top:46%; width:34px; height:58px; border-left:0; border-radius:0 16px 16px 0; opacity:.9; } body.m-frame #eject span { display:none; }
  body.m-maker #eject { display:flex; left:12px; top:12px; height:40px; padding:0 12px; border-radius:14px; }
  body.m-maker #zap, body.m-maker #mp, body.m-maker #act, body.m-maker #roomChip, body.m-maker #hint, body.m-maker #tap { display:none !important; }
  /* ---------- Tuto Maker ---------- */
  #mk { position:fixed; inset:0; z-index:6; pointer-events:none; display:none; }

<script type="module">
import * as THREE from 'three';
import { OutlineEffect } from 'three/addons/effects/OutlineEffect.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------- palette (sampled from the character sheet) ----------
const COL = {
  bg: 0xE8502E, head: 0xFDBA1C, face: 0xE4F400, torso: 0xF3C23C, pants: 0x2A2630,
  red: 0xE8502E, lav: 0xB0A2C4, lavDark: 0x7E6C9C, sticker: 0x5A4A78, ink: 0x161216,
  planet: 0x63C9AB, planetSpot: 0x4FB396, treeA: 0x8E6CC0, treeB: 0xFFE7A8, trunk: 0x3B2E3F, rock: 0xC9BFD8
};

// ---------- renderer / scene ----------
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
catch (e) { document.getElementById('err').style.display = 'flex'; throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(COL.bg);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 200);
const effect = new OutlineEffect(renderer, { defaultThickness: 0.0065, defaultColor: [0.07, 0.05, 0.07] });

scene.add(new THREE.AmbientLight(0xffffff, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 2.3);
scene.add(sun, sun.target);

// 3-band toon ramp
const ramp = new THREE.DataTexture(new Uint8Array([120, 195, 255]), 3, 1, THREE.RedFormat);
ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;
const matCache = {};
function toon(color, outline = true) {
  const k = color + (outline ? 'o' : 'n');
  if (!matCache[k]) {
    matCache[k] = new THREE.MeshToonMaterial({ color, gradientMap: ramp });
    if (!outline) matCache[k].userData.outlineParameters = { visible: false };
  }
  return matCache[k];
}
const mesh = (g, c, outline = true) => new THREE.Mesh(g, toon(c, outline));

// ---------- character ----------
// elbows and knees follow from the swing the pose already chose: arms bend as they swing forward, legs bend as they swing back or lift
function limbBends(P, runAmt) {
  for (const [hip, kn, sh, el] of [[P.hipL, P.knL, P.shL, P.elL], [P.hipR, P.knR, P.shR, P.elR]]) {
    const hx = hip.rotation.x;
    kn.rotation.x = Math.min(1.9, Math.max(0, hx) * 1.1 + Math.max(0, -hx - 0.4) * 0.55 + 0.04);
    const over = Math.min(1, Math.max(0, (Math.abs(sh.rotation.z) - 1.6) / 1.0));
    el.rotation.x = -(0.14 + Math.max(0, -sh.rotation.x) * 0.9 * (0.4 + 0.6 * runAmt)) * (1 - over);
  }
}
function buildCharacter(pal = { head: COL.head, torso: COL.torso, red: COL.red }) {
  const root = new THREE.Group();     // origin at feet, +Y up, +Z forward
  // flip pivot sits at the middle of the character (stick-cap top is at ~3.2) so flips
  // and upside-down stick-spins rotate around the right point
  const FLIP_C = 1.6;
  const flip = new THREE.Group(); flip.position.y = FLIP_C; flip.rotation.order = 'YXZ'; root.add(flip);
  const offs = new THREE.Group(); offs.position.y = -FLIP_C; flip.add(offs);
  const body = new THREE.Group(); offs.add(body);
  const parts = { flip, FLIP_C };

  // legs + boots (legs 50% longer than v1)
  const LIFT = 0.25; // everything above the hips moves up by the extra leg length
  const bootGeo = new RoundedBoxGeometry(0.3, 0.22, 0.4, 4, 0.09);
  for (const s of [-1, 1]) {
    const hip = new THREE.Group(); hip.position.set(0.16 * s, 0.62 + LIFT, 0); body.add(hip);
    // two-segment leg: thigh, knee joint, shin + boot (total length unchanged)
    const thigh = mesh(new THREE.CylinderGeometry(0.1, 0.099, 0.35, 14), COL.pants); thigh.position.y = -0.175; hip.add(thigh);
    const kn = new THREE.Group(); kn.position.y = -0.35; hip.add(kn);
    kn.add(mesh(new THREE.SphereGeometry(0.103, 14, 10), COL.pants));
    const shin = mesh(new THREE.CylinderGeometry(0.099, 0.1, 0.34, 14), COL.pants); shin.position.y = -0.17; kn.add(shin);
    const boot = mesh(bootGeo, pal.red); boot.position.set(0.01 * s, -0.4, 0.05); kn.add(boot);
    // boot shaft: covers the ankle
    const shaftB = mesh(new THREE.CylinderGeometry(0.122, 0.135, 0.2, 18), pal.red); shaftB.position.set(0.005 * s, -0.25, 0.0); kn.add(shaftB);
    parts[s < 0 ? 'knL' : 'knR'] = kn;
    parts[s < 0 ? 'hipL' : 'hipR'] = hip;
  }
  // pants (big round hips)
  const pants = mesh(new THREE.SphereGeometry(1, 28, 18), COL.pants);
  pants.scale.set(0.37, 0.29, 0.3); pants.position.y = 0.74 + LIFT; body.add(pants);
  // torso
  const torso = mesh(new THREE.CylinderGeometry(0.17, 0.3, 0.32, 24), pal.torso);
  torso.position.y = 0.99 + LIFT; body.add(torso);
  // match the torso's depth/width ratio to the pants (0.30/0.37) so the waistline sits level all the way round
  const TORSO_Z = 0.3 / 0.37; torso.scale.z = TORSO_Z; parts.torsoZ = TORSO_Z;
  const neck = mesh(new THREE.CylinderGeometry(0.11, 0.13, 0.16, 16), pal.torso);
  neck.position.y = 1.18 + LIFT; body.add(neck);
  // arms + mittens (arms 50% longer than v1)
  for (const s of [-1, 1]) {
    const sh = new THREE.Group(); sh.position.set(0.24 * s, 1.08 + LIFT, 0); sh.rotation.z = 0.38 * s; body.add(sh);
    // two-segment arm: upper arm, elbow joint, forearm + glove (reach unchanged)
    const upper = mesh(new THREE.CapsuleGeometry(0.07, 0.15, 4, 10), pal.torso); upper.position.y = -0.135; sh.add(upper);
    const el = new THREE.Group(); el.position.y = -0.27; sh.add(el);
    el.add(mesh(new THREE.SphereGeometry(0.074, 12, 10), pal.torso));

// ear-clipping triangulation of a (roughly flat) polygon given as [x,y,z] points
function triPoly(P) {
  const n = P.length; if (n < 3) return [];

  const idx = [...Array(n).keys()]; if (area < 0) idx.reverse();
  const cr = (a, b, c) => (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
  const inTri = (p, a, b, c) => cr(a, b, p) >= -1e-9 && cr(b, c, p) >= -1e-9 && cr(c, a, p) >= -1e-9;
  const out = []; let guard = 0;
  while (idx.length > 3 && guard++ < 400) {
    let clipped = false;
    for (let i = 0; i < idx.length; i++) {
      const i0 = idx[(i + idx.length - 1) % idx.length], i1 = idx[i], i2 = idx[(i + 1) % idx.length];
      if (cr(pr[i0], pr[i1], pr[i2]) <= 1e-9) continue;
      let ok = true;
      for (const j of idx) { if (j === i0 || j === i1 || j === i2) continue; if (inTri(pr[j], pr[i0], pr[i1], pr[i2])) { ok = false; break; } }
      if (!ok) continue;
      out.push([i0, i1, i2]); idx.splice(i, 1); clipped = true; break;
    }

  }

}
